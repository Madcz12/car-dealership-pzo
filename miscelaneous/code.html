                          className="w-full bg-white/5 border border-white/10 focus:border-amber-400 focus:bg-white/[0.08] rounded-xl p-4 text-sm text-white placeholder-slate-500 outline-none transition-all resize-none"
                        ></textarea>
                      </div>

                      <button 
                        type="submit"
                        className="w-full py-4 rounded-xl bg-amber-400 text-black font-heading font-bold text-xs tracking-widest uppercase hover:bg-amber-300 transition-all duration-300 shadow-[0_4px_25px_rgba(212,175,55,0.35)]"
                      >
                        Transmit Private Inquiry
                      </button>
                    </form>
                  </div>

                </div>
              </div>
            </section>

          </main>

          {/* FOOTER */}
          <footer className="bg-[#050607] border-t border-white/10 pt-16 pb-12 text-slate-400">
            <div className="max-w-7xl mx-auto px-6 lg:px-12">
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-10 mb-16">
                
                {/* Brand Bio */}
                <div className="lg:col-span-2">
                  <div className="flex items-center gap-3 mb-4">
                    <img src={LOGO_SRC} alt="VENECARS" className="w-8 h-8 object-contain filter drop-shadow-[0_0_8px_rgba(255,255,255,0.3)]" />
                    <span className="font-heading font-extrabold text-xl tracking-[0.2em] text-white">
                      VENE<span className="text-amber-400">CARS</span>
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 leading-relaxed max-w-sm mb-6">
                    Authorized luxury dealership specializing in rare hypercars, ultra-luxury sedans, and high-performance exotic vehicles. Elevating the automotive journey with discretion and integrity.
                  </p>
                  <div className="flex items-center gap-3">
                    <a href="#home" className="w-9 h-9 rounded-full bg-white/5 hover:bg-amber-400 hover:text-black text-slate-300 flex items-center justify-center transition-colors">
                      <i data-lucide="instagram" class="w-4 h-4"></i>
                    </a>
                    <a href="#home" className="w-9 h-9 rounded-full bg-white/5 hover:bg-amber-400 hover:text-black text-slate-300 flex items-center justify-center transition-colors">
                      <i data-lucide="youtube" class="w-4 h-4"></i>
                    </a>
                    <a href="#home" className="w-9 h-9 rounded-full bg-white/5 hover:bg-amber-400 hover:text-black text-slate-300 flex items-center justify-center transition-colors">
                      <i data-lucide="twitter" class="w-4 h-4"></i>
                    </a>
                    <a href="#home" className="w-9 h-9 rounded-full bg-white/5 hover:bg-amber-400 hover:text-black text-slate-300 flex items-center justify-center transition-colors">
                      <i data-lucide="linkedin" class="w-4 h-4"></i>
                    </a>
                  </div>
                </div>

                {/* Quick Nav */}
                <div>
                  <h5 className="font-heading font-bold text-xs uppercase tracking-wider text-white mb-4">Navigation</h5>
                  <ul className="space-y-2.5 text-xs">
                    <li><a href="#home" className="hover:text-amber-400 transition-colors">Home Showroom</a></li>
                    <li><a href="#inventory" className="hover:text-amber-400 transition-colors">All Inventory</a></li>
                    <li><a href="#featured" className="hover:text-amber-400 transition-colors">Featured Editions</a></li>
                    <li><a href="#why-us" className="hover:text-amber-400 transition-colors">Inspection Standards</a></li>
                    <li><a href="#contact" className="hover:text-amber-400 transition-colors">Private Viewings</a></li>
                  </ul>
                </div>

                {/* Vehicle Brands */}
                <div>
                  <h5 className="font-heading font-bold text-xs uppercase tracking-wider text-white mb-4">Portfolio</h5>
                  <ul className="space-y-2.5 text-xs">
                    <li><a href="#inventory" className="hover:text-amber-400 transition-colors">Porsche Motorsport</a></li>
                    <li><a href="#inventory" className="hover:text-amber-400 transition-colors">Mercedes-AMG</a></li>
                    <li><a href="#inventory" className="hover:text-amber-400 transition-colors">Lucid Motors</a></li>
                    <li><a href="#inventory" className="hover:text-amber-400 transition-colors">Audi Sport</a></li>
                    <li><a href="#inventory" className="hover:text-amber-400 transition-colors">Tesla Plaid</a></li>
                  </ul>
                </div>

                {/* Newsletter VIP */}
                <div>
                  <h5 className="font-heading font-bold text-xs uppercase tracking-wider text-white mb-4">Private Gazette</h5>
                  <p className="text-xs text-slate-400 mb-4">Receive off-market inventory drops and private auction invites.</p>
                  <form onSubmit={(e) => { e.preventDefault(); alert("Thank you. You have been enrolled in the Venecars Private Gazette."); }} className="space-y-2">
                    <input 
                      type="email" 
                      required
                      placeholder="Enter executive email" 
                      className="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-400"
                    />
                    <button 
                      type="submit"
                      className="w-full py-2 rounded-lg bg-amber-400 hover:bg-amber-300 text-black text-xs font-semibold uppercase tracking-wider transition-colors"
                    >
                      Subscribe
                    </button>
                  </form>
                </div>

              </div>

              <div className="pt-8 border-t border-white/5 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-4">
                <div>© 2025 VENECARS Automotive Luxury Group. All Rights Reserved.</div>
                <div className="flex gap-6">
                  <a href="#home" className="hover:text-slate-300 transition-colors">Privacy Policy</a>
                  <a href="#home" className="hover:text-slate-300 transition-colors">Terms of Conveyance</a>
                  <a href="#home" className="hover:text-slate-300 transition-colors">Provenance Certificate</a>
                </div>
              </div>
            </div>
          </footer>

          {/* TEST DRIVE BOOKING MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto bg-black/80 backdrop-blur-md animate-fade-in">
              <div className="relative w-full max-w-xl glass-card rounded-2xl border border-amber-400/30 p-6 sm:p-8 shadow-[0_20px_60px_rgba(0,0,0,0.9)] my-8">
                
                {/* Close Button */}
                <button 
                  onClick={() => setIsModalOpen(false)}
                  className="absolute top-5 right-5 w-8 h-8 rounded-full bg-white/5 hover:bg-white/15 text-slate-400 hover:text-white flex items-center justify-center transition-colors"
                >
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>

                {formStatus === "success" ? (
                  <div className="text-center py-10 animate-fade-in">
                    <div className="w-16 h-16 rounded-full bg-amber-400/20 text-amber-400 border border-amber-400 flex items-center justify-center mx-auto mb-4">
                      <i data-lucide="check" class="w-8 h-8"></i>
                    </div>
                    <h3 className="font-heading font-bold text-2xl text-white uppercase mb-2">Test Drive Reserved</h3>
                    <p className="text-slate-300 text-sm max-w-sm mx-auto">
                      Thank you, {formData.fullName}. Your test drive for the <strong className="text-amber-400">{formData.vehicle}</strong> has been tentatively booked. Our Client Concierge will contact you within 2 hours to confirm your private session.
                    </p>
                  </div>
                ) : (
                  <div>
                    <div className="mb-6">
                      <span className="text-[10px] font-mono text-amber-400 uppercase tracking-widest block mb-1">Exclusive VIP Experience</span>
                      <h3 className="font-heading font-bold text-2xl text-white uppercase">Book a Test Drive</h3>
                      <p className="text-xs text-slate-400 mt-1">Select your vehicle and preferred timeframe for an unaccompanied or chauffeured evaluation.</p>
                    </div>

                    <form onSubmit={handleFormSubmit} className="space-y-4">
                      
                      <div>
                        <label className="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-medium">Select Vehicle</label>
                        <select 
                          value={formData.vehicle}
                          onChange={(e) => setFormData({ ...formData, vehicle: e.target.value })}
                          className="w-full bg-[#12151B] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:border-amber-400 outline-none"
                        >
                          {INVENTORY_DATA.map((car) => (
                            <option key={car.id} value={`${car.brand} ${car.model}`}>
                              {car.brand} {car.model} ({car.year}) — {car.price}
                            </option>
                          ))}
                        </select>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-medium">Full Name</label>
                          <input 
                            type="text" 
                            required
                            value={formData.fullName}
                            onChange={(e) => setFormData({ ...formData, fullName: e.target.value })}
                            placeholder="e.g. Marcus Vance"
                            className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-amber-400 outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-medium">Email Address</label>
                          <input 
                            type="email" 
                            required
                            value={formData.email}
                            onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                            placeholder="marcus@vance.com"
                            className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-amber-400 outline-none"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-medium">Phone Number</label>
                          <input 
                            type="tel" 
                            required
                            value={formData.phone}
                            onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                            placeholder="+1 (555) 234-5678"
                            className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-amber-400 outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-medium">Preferred Date</label>
                          <input 
                            type="date" 
                            required
                            value={formData.preferredDate}
                            onChange={(e) => setFormData({ ...formData, preferredDate: e.target.value })}
                            className="w-full bg-[#12151B] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:border-amber-400 outline-none"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-medium">Preferred Time Window</label>
                        <select 
                          value={formData.timeSlot}
                          onChange={(e) => setFormData({ ...formData, timeSlot: e.target.value })}
                          className="w-full bg-[#12151B] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:border-amber-400 outline-none"
                        >
                          <option>Morning (10:00 AM - 1:00 PM)</option>
                          <option>Afternoon (1:00 PM - 5:00 PM)</option>
                          <option>Twilight Sunset Session (5:00 PM - 8:00 PM)</option>
                        </select>
                      </div>

                      <div className="pt-2">
                        <button 
                          type="submit"
                          disabled={formStatus === "submitting"}
                          className="w-full py-3.5 rounded-xl bg-amber-400 text-black font-heading font-bold text-xs tracking-widest uppercase hover:bg-amber-300 transition-all duration-300 shadow-[0_0_25px_rgba(212,175,55,0.4)] flex items-center justify-center gap-2"
                        >
                          {formStatus === "submitting" ? (
                            <span>Securing Reservation...</span>
                          ) : (
                            <>
                              <i data-lucide="shield-check" class="w-4 h-4"></i>
                              <span>Confirm VIP Test Drive Reservation</span>
                            </>
                          )}
                        </button>
                      </div>

                      <p className="text-[10px] text-center text-slate-500 mt-2">
                        Requires a valid driver's license and security deposit authorization at appointment time.
                      </p>

                    </form>
                  </div>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
